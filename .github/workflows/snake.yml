name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: syedaliabbas1
          outputs: |
            dist/snake.svg?palette=github
            dist/snake-dark.svg?palette=github-dark
            dist/space-shooter.gif?color_snake=%23f09c1a&color_dots=%23161b22,%230e4429,%23006d32,%2326a641,%2339d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update contribution animation"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/syedaliabbas1/syedaliabbas1.git" HEAD:output
