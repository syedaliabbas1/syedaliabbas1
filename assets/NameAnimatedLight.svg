<svg xmlns="http://www.w3.org/2000/svg" width="800" height="267" viewBox="0 0 300 100">
  <defs>
    
  <linearGradient id="cg" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="300" y2="50">
    <stop offset="0%" stop-color="#eab308"/><stop offset="25%" stop-color="#ef4444"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="75%" stop-color="#06b6d4"/><stop offset="100%" stop-color="#8b5cf6"/>
  </linearGradient>
    
  <radialGradient id="rg" gradientUnits="userSpaceOnUse" cx="-80" cy="50" r="100">
    <stop offset="0%" stop-color="white"/>
    <stop offset="100%" stop-color="black"/>
    <animate attributeName="cx" values="-80;380;-80" dur="3s" begin="4.2s" repeatCount="indefinite"/>
  </radialGradient>
    <mask id="rm"><rect x="0" y="0" width="300" height="100" fill="url(#rg)"/></mask>
  </defs>

  <!-- Base outline: fades in after draw completes -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
   fill="none" stroke-width="0.3" font-size="22"
   font-weight="bold" font-family="helvetica, Arial, sans-serif" stroke="#bbb">
    Syed Ali Abbas
    <animate attributeName="opacity" values="0;0;0.6" keyTimes="0;0.85;1" dur="5s" fill="freeze"/>
  </text>

  <!-- Draw animation: stroke-dashoffset writes the text -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
   fill="none" stroke-width="0.3" font-size="22"
   font-weight="bold" font-family="helvetica, Arial, sans-serif" stroke="#999" stroke-dasharray="2000" stroke-dashoffset="2000">
    Syed Ali Abbas
    <animate attributeName="stroke-dashoffset" from="2000" to="0"
             begin="0.2s" dur="4s" fill="freeze"
             calcMode="spline" keyTimes="0;1" keySplines="0.42,0,0.58,1"/>
  </text>

  <!-- Gradient text revealed by sweeping radial mask -->
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle"
   fill="none" stroke-width="0.3" font-size="22"
   font-weight="bold" font-family="helvetica, Arial, sans-serif" stroke="url(#cg)" mask="url(#rm)">
    Syed Ali Abbas
  </text>
</svg>