<svg xmlns="http://www.w3.org/2000/svg" width="800" height="170" viewBox="0 0 800 170">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed">
        <animate attributeName="stop-color"
                 values="#7c3aed;#2563eb;#059669;#2563eb;#7c3aed"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#059669">
        <animate attributeName="stop-color"
                 values="#059669;#7c3aed;#2563eb;#7c3aed;#059669"
                 dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <mask id="revealName">
      <rect x="0" y="0" width="0" height="170" fill="white">
        <animate attributeName="width" from="0" to="800"
                 dur="1.4s" begin="0.2s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.4,0,0.2,1"/>
      </rect>
    </mask>
    <mask id="revealSub">
      <rect x="0" y="0" width="0" height="170" fill="white">
        <animate attributeName="width" from="0" to="800"
                 dur="1s" begin="1.6s" fill="freeze"
                 calcMode="spline" keyTimes="0;1" keySplines="0.4,0,0.2,1"/>
      </rect>
    </mask>
  </defs>

  <text x="400" y="100"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="62" font-weight="bold" letter-spacing="1"
        fill="url(#g)"
        mask="url(#revealName)">
    Syed Ali Abbas
  </text>

  <text x="400" y="143"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
        font-size="16" fill="#57606a" letter-spacing="0.5"
        mask="url(#revealSub)">
    MEng Computer Science @ UCL · AI Systems · Full-Stack · Robotics
  </text>
</svg>
